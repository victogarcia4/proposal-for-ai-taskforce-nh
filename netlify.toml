[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  GITHUB_REPOSITORY = "victogarcia4/proposal-for-ai-taskforce-nh"
  GITHUB_BRANCH = "main"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200

[[redirects]]
  from = "/api/file"
  to = "/.netlify/functions/file"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"


